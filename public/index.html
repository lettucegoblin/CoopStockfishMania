<link rel="stylesheet" href="css/chessboard-1.0.0.min.css">

<script src="js/chessboard-1.0.0.min.js"></script>
<script src="js/stockfish.js"></script>
<script src="js/chess.js"></script>
<script src='js/Sortable.min.js'></script>
<link rel="stylesheet" href="css/shepherd.css"/>

<script src="js/index.js" defer></script>
<script src="js/tour.js" defer></script>

<link rel="stylesheet" href="css/index.css">

<!-- Game Over Toast Notification -->
<div id="gameOver" class="toast">
	<div id="gameOverText"></div>
</div>

<div id='gameWrapper'>
	<div id='boardWrapper'>
		<div id='evalBar'>
			<div id='centipawns'></div>
			<div id='blackBar'></div>
		</div>
		<div id="myBoard"></div>
	</div>

	<div id='turnOrderWrapper'>
		<div id='players'>

		</div>
		<div id='turnOrder'></div>
		<div id='restartGame'>Restart Game</div>
	</div>
</div>

<!-- Difficulty Modal -->
<div id="difficultyModal" class="modal">
	<div class="modal-content">
		<span class="close">&times;</span>
		<h2>Bot Difficulty</h2>
		<p>Set Stockfish skill level (0 = easiest, 20 = hardest)</p>
		<input type="range" id="difficultySlider" min="0" max="20" value="10" step="1">
		<div id="difficultyValue">Level: 10</div>
		<button id="saveDifficulty">Save</button>
	</div>
</div>
